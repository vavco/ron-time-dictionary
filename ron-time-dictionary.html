<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מילון הזמנים של רון</title>
<style>
:root{--bg:linear-gradient(135deg,#cdeeff 0%,#c4f3ec 55%,#dff9ea 100%);--card:#ffffff;--ink:#1b2d3d;--muted:#2c4a63;--acc:#0a6a9c;--acc-soft:#ece5ff;--line:#e2d9f5;--key:#faf8ff;--key-h:#efe9ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#150f24;--card:#1f1733;--ink:#f1ecff;--muted:#a79cc4;--acc:#6fd0ff;--acc-soft:#2b2148;--line:#362c58;--key:#241b3d;--key-h:#302553}}
:root[data-theme="dark"]{--bg:#150f24;--card:#1f1733;--ink:#f1ecff;--muted:#a79cc4;--acc:#6fd0ff;--acc-soft:#2b2148;--line:#362c58;--key:#241b3d;--key-h:#302553}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;min-height:100vh;padding:16px;overflow-x:hidden}
.wrap{max-width:720px;margin:0 auto}
header{text-align:center;padding:8px 0 4px}
h1{margin:0;font-size:clamp(26px,6.5vw,36px);font-weight:800;color:#1e3a8a;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.sub{color:#1e3a8a;margin:6px 0 14px;font-size:16px;font-weight:600}
.langs{display:flex;justify-content:center;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:15px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 6px 18px rgba(60,40,120,.08)}
.result{position:sticky;top:8px;z-index:2;background:var(--card);border-radius:14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin-bottom:16px;box-shadow:0 4px 12px rgba(60,40,120,.12)}
.result .say{color:var(--muted);font-size:15px;margin-bottom:8px;min-height:22px}
.result .answer{font-size:clamp(19px,4.6vw,24px);font-weight:700;line-height:1.5;word-break:break-word;color:var(--acc)}
.result .emo{font-size:44px;margin-top:6px;min-height:50px}
.result.pop .answer,.result.pop .emo{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}
.chip{position:relative;background:var(--c,var(--key));color:#261b3d;border:1px solid rgba(38,27,61,.12);border-radius:14px;padding:12px 8px;font-size:15px;font-weight:700;cursor:pointer;min-height:52px;line-height:1.3;transition:filter .15s,transform .1s;font-family:inherit;box-shadow:0 3px 0 rgba(38,27,61,.08)}
.chip:hover{filter:brightness(.97) saturate(1.1)}
.chip:active{transform:scale(.97)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.tools button{background:linear-gradient(90deg,#0369a1,#0f766e);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;white-space:pre-line;line-height:1.5;text-align:center}
.count{color:var(--muted);font-size:14px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr}.result{min-height:118px}.result .emo{font-size:36px;min-height:40px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span aria-hidden="true">⏰</span> <span id="title">מילון הזמנים של רון</span></h1>
    <p class="sub" id="sub">לחצו על ביטוי וקבלו את האמת</p>
  </header>

  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="he" aria-pressed="true">עברית</button>
    <button type="button" data-lang="en" aria-pressed="false">English</button>
    <button type="button" data-lang="es" aria-pressed="false">Español</button>
  </div>

  <section class="card">
    <div class="result" id="result" aria-live="polite">
      <div class="say" id="say"></div>
      <div class="answer" id="answer"></div>
      <div class="emo" id="emo"></div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="tools">
      <button type="button" id="random">עכשיו! – תודו שלרגע האמנתם (:</button>
      <span class="count" id="count"></span>
    </div>
  </section>

  <footer id="foot">נבנה במיוחד לרון 🎂</footer>
</div>

<script>
(function () {
  // Each phrase: [phrase, response] per language. Responses end with an emoji.
  var PHRASES = [
    { he: ["היום", "תלוי באיזו מדינה אני נמצא 🌍"],
      en: ["Today", "Depends which country I'm in 🌍"],
      es: ["Hoy", "Depende del país en el que esté 🌍"] },
    { he: ["מחר", "מחר זה יום מצוין. תמיד. 🌙"],
      en: ["Tomorrow", "Tomorrow is a great day. Always 🌙"],
      es: ["Mañana", "Mañana es un gran día. Siempre 🌙"] },
    { he: ["במהלך השבוע", "מקווה שאתם מבינים שהכוונה למהלך השבוע הבא 🗓️"],
      en: ["During the week", "Hoping you get that I mean next week 🗓️"],
      es: ["Durante la semana", "Espero que entiendan: la semana que viene 🗓️"] },
    { he: ["בקרוב", "חחחחחחחחח 😂"],
      en: ["Soon", "hahahahahaha 😂"],
      es: ["Pronto", "jajajajaja 😂"] },
    { he: ["בבוא העת", "מתישהו בעתיד הרחוק מאד. תהיו אופטימיים! 🌅"],
      en: ["In due time", "Some distant future. Be optimistic! 🌅"],
      es: ["A su debido tiempo", "En un futuro muy lejano. ¡Sean optimistas! 🌅"] },
    { he: ["בחודש הבא", "חודש/שנה, מי סופר? 📆"],
      en: ["Next month", "Month/year, who's counting? 📆"],
      es: ["El mes que viene", "Mes/año, ¿quién cuenta? 📆"] },
    { he: ["התפנה לי המון זמן", "עכשיו נתחיל את ספירת הזמן מחדש 🛋️"],
      en: ["I've got loads of free time", "Now we restart the clock on time 🛋️"],
      es: ["Tengo muchísimo tiempo libre", "Ahora volvemos a empezar a contar el tiempo 🛋️"] },
    { he: ["נצטרך לדחות ביום", "או בכמה ימים. זה מה שאני עושה הכי טוב 📅"],
      en: ["We'll need to postpone a day", "Or a few days. What I do best 📅"],
      es: ["Habrá que posponer un día", "O unos días. Lo que mejor hago 📅"] },
    { he: ["כבר", "יפה שאתם עדיין מאמינים לזה 🙃"],
      en: ["Already", "Cute that you still believe that 🙃"],
      es: ["Ya", "Qué bonito que todavía lo creen 🙃"] },
    { he: ["בשעה הקרובה", "מקווה שזה יקרה עד סוף השבוע, לא מתחייב ⏳"],
      en: ["In the near future", "Hopefully by the weekend, no promises ⏳"],
      es: ["En las próximas horas", "Ojalá para el fin de semana, sin promesas ⏳"] },
    { he: ["עוד רגע", "המילה רגע לא באמת קיימת בלקסיקון שלי 🕰️"],
      en: ["In a sec", "The word 'moment' isn't in my vocabulary 🕰️"],
      es: ["Un momentito", "La palabra 'momento' no existe en mi diccionario 🕰️"] },
    { he: ["אני בדרך", "אבל יש פקק תנועה לא צפוי של שעתיים 🚗"],
      en: ["I'm on my way", "But there's a two-hour traffic jam 🚗"],
      es: ["Ya voy", "Pero hay un atasco inesperado de dos horas 🚗"] },
    { he: ["בעוד חצי שעה", "או 20 שעות, אותו דבר 🕐"],
      en: ["In half an hour", "Or 20 hours, same thing 🕐"],
      es: ["En media hora", "O 20 horas, da igual 🕐"] },
    { he: ["מחר בבוקר", "אין סיכוי. אני לא איש של בקרים ☕"],
      en: ["Tomorrow morning", "No chance. I'm not a morning person ☕"],
      es: ["Mañana por la mañana", "Ni hablar. No soy persona de mañanas ☕"] },
    { he: ["בסוף השבוע", "לא כולל שישי, שבת וראשון 🛌"],
      en: ["At the weekend", "Not Friday, Saturday or Sunday 🛌"],
      es: ["Este fin de semana", "No el viernes, sábado ni domingo 🛌"] },
    { he: ["בשנה הבאה", "בשנה הבאה, ואני מתכוון לזה 🎂"],
      en: ["Next year", "Next year, and I mean it 🎂"],
      es: ["El año que viene", "El año que viene, lo prometo 🎂"] },
    { he: ["כשיהיה לי זמן", "כנראה לעולם לא 🤷"],
      en: ["When I have time", "Probably never 🤷"],
      es: ["Cuando tenga tiempo", "Probablemente nunca 🤷"] },
    { he: ["ברגע האחרון", "כמו תמיד, אין מה להתרגש 😬"],
      en: ["At the last minute", "As always, nothing to get excited about 😬"],
      es: ["En el último minuto", "Como siempre, nada que emocionarse 😬"] },
    { he: ["בזמן המתאים", "זה תמיד עוד מעט 🎯"],
      en: ["At the appropriate time", "It's always a little bit later 🎯"],
      es: ["En el momento oportuno", "Siempre es un poco más tarde 🎯"] },
    { he: ["אחרי החג", "רק שאני לא תמיד יודע מתי החג 🎉"],
      en: ["After the holiday", "Only I don't always know when it is 🎉"],
      es: ["Después de las fiestas", "Pero no siempre sé cuándo es la fiesta 🎉"] },
    { he: ["ביום שני הבא", "ואם לא אז שני שאחריו וכן הלאה 📌"],
      en: ["Next Monday", "Or the Monday after, and so on 📌"],
      es: ["El lunes que viene", "O el lunes siguiente, y así sucesivamente 📌"] },
    { he: ["ברגע שאתפנה", "שזה בערך בלתי אפשרי 🧘"],
      en: ["The moment I'm free", "Which is practically impossible 🧘"],
      es: ["En cuanto me libere", "Lo que es prácticamente imposible 🧘"] },
    { he: ["אחרי שאנוח קצת", "שזה נצח 😴"],
      en: ["After I rest a bit", "Which is forever 😴"],
      es: ["Después de descansar un poco", "O sea, para siempre 😴"] },
    { he: ["אחרי שאתאקלם", "תנשמו, זה לא הולך לקרות כל כך מהר 🌬️"],
      en: ["After I adjust", "Breathe, it's not happening that fast 🌬️"],
      es: ["Después de adaptarme", "Respiren, no va a pasar tan rápido 🌬️"] },
    { he: ["נכוון לספטמבר 25", "ונקווה שבמקרה הטוב זה יהיה ינואר 27 🍀"],
      en: ["Let's say September 25", "Hopefully best case, January 27 🍀"],
      es: ["Digamos 25 de septiembre", "Ojalá, en el mejor caso, 27 de enero 🍀"] }
  ];

  var UI = {
    he: { dir: "rtl", title: "מילון הזמנים של רון", sub: "לחצו על ביטוי וקבלו את האמת",
          random: "הפתעה 🎲", surprise: "אני עושה את זה ממש עכשיו...\nתודו שלרגע האמנתם (: 😂",
          count: function (n) { return "מספר הדחיות עד כה: " + n; },
          foot: "נבנה במיוחד לרון 🎂",
          pick: "לחצו על ביטוי כדי לשמוע את התשובה" },
    en: { dir: "ltr", title: "Ron's Time Dictionary", sub: "Tap a phrase, get the truth",
          random: "Surprise me 🎲", surprise: "I'm doing it right now...\nadmit you believed it for a second (: 😂",
          count: function (n) { return "Postponements so far: " + n; },
          foot: "Made just for Ron 🎂",
          pick: "Tap a phrase to hear the truth" },
    es: { dir: "ltr", title: "Diccionario de tiempos de Ron", sub: "Toca una frase y recibe la verdad",
          random: "Sorpréndeme 🎲", surprise: "Lo estoy haciendo ahora mismo...\nadmitan que por un segundo lo creyeron (: 😂",
          count: function (n) { return "Aplazamientos hasta ahora: " + n; },
          foot: "Hecho especialmente para Ron 🎂",
          pick: "Toca una frase para oír la verdad" }
  };

  var LANGS = ["he", "en", "es"];
  var KEY_LANG = "ron_lang";
  var KEY_COUNT = "ron_count";
  var lang = "he";
  var count = 0;

  function store(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
  function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

  var el = {
    title: document.getElementById("title"), sub: document.getElementById("sub"),
    grid: document.getElementById("grid"), result: document.getElementById("result"),
    say: document.getElementById("say"), answer: document.getElementById("answer"),
    emo: document.getElementById("emo"), count: document.getElementById("count"),
    random: document.getElementById("random"), foot: document.getElementById("foot")
  };

  function splitEmoji(text) {
    // The emoji is the last space-separated token when it has no letters.
    var parts = text.split(" ");
    var last = parts[parts.length - 1];
    if (/[֐-׿A-Za-z¿¡]/.test(last)) return { text: text, emo: "" };
    parts.pop();
    return { text: parts.join(" "), emo: last };
  }

  function showCount() {
    el.count.textContent = UI[lang].count(count);
  }

  function setLang(next) {
    if (LANGS.indexOf(next) === -1) next = "he";
    lang = next;
    var t = UI[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = t.dir;
    el.title.textContent = t.title;
    el.sub.textContent = t.sub;
    el.random.textContent = t.random;
    el.foot.textContent = t.foot;
    document.title = t.title;
    Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
    });
    renderGrid();
    showIdle();
    showCount();
    store(KEY_LANG, lang);
  }

  function renderGrid() {
    el.grid.innerHTML = "";
    PHRASES.forEach(function (item, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      // Each phrase gets its own pastel color, spread around the color wheel.
      // Six clearly different blues, turquoise, sea-green and yellow. Neighbours never share a hue.
      var PALETTE = ["hsl(212 78% 78%)", "hsl(50 90% 74%)", "hsl(178 60% 70%)",
                     "hsl(232 70% 80%)", "hsl(152 50% 68%)", "hsl(200 85% 88%)"];
      b.style.setProperty("--c", PALETTE[i % PALETTE.length]);
      b.textContent = item[lang][0];
      b.addEventListener("click", function () { choose(i); });
      el.grid.appendChild(b);
    });
  }

  function showIdle() {
    el.say.textContent = "";
    el.answer.textContent = UI[lang].pick;
    el.emo.textContent = "";
  }

  function choose(i) {
    var item = PHRASES[i];
    var parts = splitEmoji(item[lang][1]);
    el.say.textContent = item[lang][0];
    el.answer.textContent = parts.text;
    el.emo.textContent = parts.emo;
    el.result.classList.remove("pop");
    void el.result.offsetWidth; // restart animation
    el.result.classList.add("pop");
    count += 1;
    store(KEY_COUNT, String(count));
    showCount();
  }

  Array.prototype.forEach.call(document.querySelectorAll(".langs button"), function (b) {
    b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
  });

  el.random.addEventListener("click", function () {
    // The surprise button changes its own text to a fixed two-line joke; it is not counted.
    el.random.textContent = UI[lang].surprise;
  });

  var savedCount = parseInt(load(KEY_COUNT) || "0", 10);
  count = isNaN(savedCount) ? 0 : savedCount;
  var savedLang = load(KEY_LANG);
  setLang(LANGS.indexOf(savedLang) !== -1 ? savedLang : "he");
})();
</script>
</body>
</html>
